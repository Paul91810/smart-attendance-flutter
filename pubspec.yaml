name: smart_attendance
description: "Smart QR-Based Attendance Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking & HTTP
  dio: ^5.7.0

  # Local Persistence & Storage
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Hardware & Device
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.0

  # Security & Utilities
  crypto: ^3.0.6
  get_it: ^8.0.3
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
